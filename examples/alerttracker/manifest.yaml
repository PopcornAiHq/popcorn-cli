# Alert Tracker — ops alert ingest (Step 0' slice).
#
# Untyped bundle: no `app_type:`, which means installing it CLEARS any
# existing app_type on the channel. Only install into a dedicated ops channel.
# `popcorn flow import --dry-run` warns about this before you commit.
display_name: Alert Tracker
description: Ingests ops alerts, dedups them by fingerprint, tracks triage.

channel_parameters:
  # Plain positive durations. alert_tick passes them to
  # foundation.math.offset with `direction: subtract`, so the flow names the
  # direction and the value stays readable.
  nudge_after_minutes: 30
  auto_resolve_hours: 6

tables:
  alerts:
    columns:
      # unique:true both enforces one row per incident AND satisfies
      # merge_key's "must be indexed" requirement. Must be a string: the
      # merge-key OR-probe only queries RecordIndex.value_text, so a
      # non-string key would silently never match.
      - { name: Fingerprint, type: string, unique: true }
      - { name: Title, type: string }
      - { name: Source, type: string,
          display: "status:cloudwatch,alertmanager,github,manual" }
      # `warn=` is the documented warning-treatment segment. (`tone=` is not
      # part of the display grammar — see GOTCHAS.md.)
      - { name: Severity, type: string,
          display: "status:critical,warning,info;warn=critical" }
      - { name: Env, type: string, display: "status:dev,prod,tools" }
      - { name: Resource, type: string }
      - { name: Status, type: string,
          display: "status:firing,acked,snoozed,resolved;warn=firing" }
      - { name: First Seen, type: datetime }
      - { name: Last Seen, type: datetime }
      # NOT a counter: the DSL has no arithmetic. One ISO timestamp appended
      # per fire, via the only merge mode that exists. merge:concat requires
      # type:string, so this is a string and not a datetime.
      - { name: Seen At, type: string, merge: concat }
      - { name: Acked By, type: string }
      - { name: Acked At, type: datetime }
      - { name: Snooze Until, type: datetime }
      - { name: Resolved At, type: datetime }
      - { name: Details, type: string }
      - { name: Nudged At, type: string, merge: concat, internal: true }
      # SPACE-FREE ON PURPOSE. Every other column here keeps its spaces
      # because flows only ever write them (YAML map keys) or filter on them
      # (JSON keys) — both tolerate spaces. This one is DEREFERENCED, as
      # `$row.PostMessageId` in alert_tick/alert_apply, and the DSL's
      # reference grammar is [A-Za-z_][A-Za-z0-9_.]* — a space makes it
      # unparseable. See GOTCHAS.md #19.
      - { name: PostMessageId, type: string, internal: true }
      - { name: Raw, type: json, internal: true }
    merge_key:
      any_of: [Fingerprint]
      on_conflict: merge

scalars:
  # UPSERT on EVERY install. Only put install-time configuration here —
  # anything a flow writes at runtime (alerts_summary, alerts_digest) would be
  # reset on each re-import, so those are deliberately absent.
  agent_runnable_flows: '["alert_apply", "alert_tick", "alert_digest", "seed_test_alert"]'
  agent_summary: |
    This channel tracks ops alerts in the `alerts` table, one row per incident
    keyed by Fingerprint. Status is one of firing/acked/snoozed/resolved.

    To triage on the user's behalf, run the `alert_apply` flow with
    {action: ack|snooze|resolve, fingerprints: [...]}. Snoozing also needs
    `snooze_until` as an ISO-8601 timestamp — compute it yourself, the flow
    cannot do date arithmetic. Never edit rows directly; alert_apply keeps the
    original channel post in sync.

schedules:
  # REPLACE semantics: this list wholesale replaces the channel's schedules on
  # every install. <channel-conversation-id> is substituted with the real id
  # at install time — that is how a portable bundle addresses its own channel.
  - flow: alert_tick
    slug: alert-tick
    interval: 300
    overlap: skip
    jitter: 30
    inputs:
      conversation_id: <channel-conversation-id>
  - flow: alert_digest
    slug: alert-digest
    cron: "0 8 * * *"
    timezone: America/New_York
    inputs:
      conversation_id: <channel-conversation-id>

webhooks:
  - name: Alerts
    description: Ops alert intake.
    flow: alert_webhook
