name: alert_tick
version: 1
description: >
  Periodic sweep: nudge alerts nobody has acked, auto-resolve alerts that have
  gone quiet, and refresh the channel summary. Driven by the `alert-tick`
  schedule (300s, overlap: skip).

  This flow is fully deterministic — no LLM call — and the shape it takes is
  dictated by one platform limit.

  `when:` supports only `==` / `!=`, one comparison, no `&&`. So "is this row
  older than the threshold" cannot be expressed as a step gate. The answer is
  the agent-store filter DSL, which does support `$lt`/`$gte`/`$in`/`$exists`
  and orders ISO-8601 correctly because the comparison is lexicographic. Every
  selection below happens in the database, exactly, rather than in a gate.

  It used to spend one `agent.transform` per run — 288 LLM calls a day — purely
  to subtract two durations from `now`, because nothing in the DSL could do
  date arithmetic. `foundation.math.offset` (popcorn-backend PR #1714) closed
  that gap, and the two `*_cutoff` steps below replaced the LLM call and the
  recognition guard that had to police it.

inputs:
  conversation_id: { type: string }

steps:
  - id: now
    activity: foundation.workflow.now

  # Both sweep bounds, computed deterministically. `iso` pins them to the one
  # clock read above, so every timestamp in this tick derives from the same
  # instant rather than three separate reads.
  #
  # `direction: subtract` with a POSITIVE duration, which is why the channel
  # parameters read as plain "30 minutes" / "6 hours". The predecessor
  # (foundation.workflow.offset, now deprecated) took a SIGNED duration, and
  # since the DSL cannot negate a reference — `-$channel.x` parses as a literal
  # string and fails the integer check — the sign had to be baked into the
  # configured value as `nudge_offset_minutes: -30`. Naming the direction
  # instead removes that wart entirely.
  - id: resolve_cutoff
    activity: foundation.math.offset
    args:
      iso: $steps.now.output.iso
      direction: subtract
      hours: $channel.auto_resolve_hours

  - id: nudge_cutoff
    activity: foundation.math.offset
    args:
      iso: $steps.now.output.iso
      direction: subtract
      minutes: $channel.nudge_after_minutes

  # ---- auto-resolve -------------------------------------------------------
  # Anything still `firing` whose last sighting predates the resolve cutoff.
  # Both predicates live in the filter; neither is expressible as a `when:`.
  # "Last Seen" keeps its space: filter keys are JSON, not refs.
  - id: stale
    activity: foundation.store.list_rows
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      filter:
        Status: firing
        Last Seen: { $lt: $steps.resolve_cutoff.output.iso }
      drop_columns: [Raw]

  # A SECOND query, not a reuse of `stale`, and the difference is load-bearing.
  #
  # Not every row has a PostMessageId: the `post` step in alert_webhook is
  # gated on created == 1 and can be skipped, and any row predating the column
  # simply lacks the key. Referencing a MISSING key is a hard ReferenceError
  # that fails the whole run:
  #
  #   ReferenceError: $row.PostMessageId: key not found
  #
  # `on_error: {policy: skip}` does NOT rescue it — reference resolution
  # happens before the activity is invoked, so the step never gets far enough
  # for its error policy to apply. Observed live: the first scheduled tick to
  # sweep an old row died here.
  #
  # So the guarantee has to come from the query. `$exists: true` means every
  # row reaching this foreach is known to carry the key.
  - id: closable
    activity: foundation.store.list_rows
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      filter:
        Status: firing
        Last Seen: { $lt: $steps.resolve_cutoff.output.iso }
        PostMessageId: { $exists: true }
      drop_columns: [Raw]

  - id: auto_resolve
    activity: foundation.store.patch_row
    foreach: $steps.stale.output.rows
    as: row
    max_parallel: 1
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      record_id: $row._record_id
      patch:
        Status: resolved
        Resolved At: $steps.now.output.iso

  - id: close_posts
    activity: foundation.channel.edit
    foreach: $steps.closable.output.rows
    as: row
    max_parallel: 1
    on_error: { policy: skip, retry: 1 }
    args:
      channel_id: $inputs.conversation_id
      message_id: $row.PostMessageId
      text: $row.Title

  # ---- nudge --------------------------------------------------------------
  # Still firing, first seen before the nudge cutoff, and never nudged.
  # `$exists: false` is what keeps this from re-nudging every 5 minutes —
  # `Nudged At` is a concat column, so once it holds anything the row drops
  # out of this filter. That makes the nudge exactly-once per incident, which
  # is why a second tick inside the window posts nothing.
  - id: unacked
    activity: foundation.store.list_rows
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      filter:
        Status: firing
        First Seen: { $lt: $steps.nudge_cutoff.output.iso }
        Nudged At: { $exists: false }
      drop_columns: [Raw]

  - id: nudge
    activity: foundation.channel.post
    foreach: $steps.unacked.output.rows
    as: row
    max_parallel: 1
    on_error: { policy: skip, retry: 1 }
    args:
      channel_id: $inputs.conversation_id
      text: $row.Title

  - id: mark_nudged
    activity: foundation.store.patch_row
    foreach: $steps.unacked.output.rows
    as: row
    max_parallel: 1
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      record_id: $row._record_id
      patch:
        # concat column: one ISO stamp appended per nudge, never a counter.
        Nudged At: $steps.now.output.iso

  # ---- summary ------------------------------------------------------------
  # Runtime state, so it is deliberately NOT declared under the manifest's
  # `scalars:` — those UPSERT on every install and would reset a live channel.
  - id: firing_now
    activity: foundation.store.list_rows
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      filter:
        Status: firing
      drop_columns: [Raw]

  - id: summary
    activity: foundation.store.set_scalar
    args:
      conversation_id: $inputs.conversation_id
      key: alerts_summary
      # Scalars are strings on the wire. unix_str exists precisely so a
      # timestamp can be fed straight into set_scalar without coercion.
      value: $steps.now.output.unix_str

outputs:
  resolved: $steps.stale.output.rows
  nudged: $steps.unacked.output.rows
