name: alert_digest
version: 1
description: >
  Daily rollup of the alert table, posted to the channel. Driven by the
  `alert-digest` schedule (08:00 America/New_York).

  This flow uses `agent.transform` for PROSE, not for field mapping — the
  distinction that decides whether a transform is safe. Nothing downstream
  parses the result: it is posted verbatim and stored verbatim. Model drift
  changes the wording of a summary, which is the one place in this bundle
  where non-determinism costs nothing.

inputs:
  conversation_id: { type: string }

steps:
  - id: now
    activity: foundation.workflow.now

  # No filter: the digest is a whole-table view. Raw is dropped because a
  # digest over many rows would otherwise drag every original webhook payload
  # through Temporal's event history.
  - id: rows
    activity: foundation.store.list_rows
    args:
      conversation_id: $inputs.conversation_id
      table_name: alerts
      limit: 200
      drop_columns: [Raw]

  - id: render
    activity: foundation.agent.transform
    on_error: { policy: fail, retry: 1 }
    args:
      data:
        alerts: $steps.rows.output.rows
        generated_at: $steps.now.output.iso
      prompt: >
        Write a short daily ops digest from the alert rows provided.

        Lead with the count still firing and the count acked but unresolved —
        those are the two numbers an on-call reader acts on. Then list the
        firing alerts, most severe first, one line each: severity, resource,
        and how the title describes the condition. Mention anything resolved
        in the last day only as a count, not a list.

        Plain text, no markdown headers, under 1500 characters. If there are
        no alerts at all, say exactly that in one sentence and stop — do not
        pad, and do not invent alerts to fill the digest.
      output_schema:
        type: object
        required: [text]
        properties:
          text: { type: string }

  - id: post
    activity: foundation.channel.post
    on_error: { policy: skip, retry: 1 }
    args:
      channel_id: $inputs.conversation_id
      text: $steps.render.output.text

  # Runtime state — deliberately absent from the manifest's `scalars:`.
  - id: store
    activity: foundation.store.set_scalar
    args:
      conversation_id: $inputs.conversation_id
      key: alerts_digest
      value: $steps.render.output.text

outputs:
  digest: $steps.render.output.text
