name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or rapid re-push supersedes the older run rather than queueing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Separate from `test` rather than a step inside it: the scan is a few
  # milliseconds and its answer does not vary by interpreter, so running it
  # once beats running it on all four matrix legs.
  public-repo:
    name: No internal-only references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message scan walks the PR's own commits.
          fetch-depth: 0

      # A hook only sees what someone with `pre-commit install` staged. This is
      # the check that holds for a contributor who never ran it, and for content
      # that is already committed.
      - name: Check for internal-only references
        run: scripts/check-public-repo.sh

      # The squash merge takes main's commit body from these messages and its
      # subject from the commit or the PR title, so both are published on main.
      - name: Check commit messages and PR title
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          scripts/check-public-repo.sh --commits "$RANGE"
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title"
          scripts/check-public-repo.sh --message "$RUNNER_TEMP/pr-title"

  # PR-only: on `main` an already-tagged version is the normal state for a
  # merge that ships nothing, so a check that fired there would be red for a
  # correct tree — which is how a check gets ignored.
  version:
    name: Version is releasable
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The PR ref alone carries neither the base branch nor the tag list, and
      # the check needs both: the base to see whether the version moved, the
      # tags to see whether the number is already spent.
      - name: Fetch base and tags
        run: git fetch --tags --force origin main

      - name: Check the version
        run: scripts/check_version.py origin/main

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declares requires-python = ">=3.10", so every version we
      # claim to support gets exercised — the CLI is installed by users on
      # whatever interpreter they already have.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/popcorn_core src/popcorn_cli

      - name: Test
        run: uv run pytest tests/ -q
