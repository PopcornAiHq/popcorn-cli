name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or rapid re-push supersedes the older run rather than queueing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declares requires-python = ">=3.10", so every version we
      # claim to support gets exercised — the CLI is installed by users on
      # whatever interpreter they already have.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/popcorn_core src/popcorn_cli

      - name: Test
        run: uv run pytest tests/ -q
