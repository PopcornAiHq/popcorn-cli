name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Notes are built by `scripts/release_notes.sh`, shared with the
      # auto-tag workflow so the shell-injection guard it documents lives in
      # one place rather than in two `run:` blocks that can drift.
      #
      # `github.ref_name` goes through `env:` deliberately: a `${{ }}`
      # expansion is pasted into the script before bash ever sees it, so the
      # quoting that would make it safe is not applied to it.
      - name: Create release
        run: |
          scripts/release_notes.sh "$TAG" release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
