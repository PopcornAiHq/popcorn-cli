# commit-msg is installed alongside pre-commit so the public-repo check sees
# the message too. Hooks without their own `stages` stay pre-commit-only.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: check-version-bump
        name: check version bump
        entry: scripts/check-version-bump.sh
        language: script
        always_run: true
        pass_filenames: false
        verbose: true

      # Scans the whole index, not just the staged paths, so it needs no
      # filenames and must run even for a commit that touches nothing.
      - id: check-public-repo
        name: check for internal-only references (this repo is public)
        entry: scripts/check-public-repo.sh
        language: script
        always_run: true
        pass_filenames: false

      # Merging publishes branch commit messages on main verbatim.
      - id: check-public-repo-message
        name: check commit message for internal-only references
        entry: scripts/check-public-repo.sh --message
        language: script
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        stages: [manual]
        additional_dependencies: [httpx, pyjwt, types-pyjwt]
        args: [--config-file=pyproject.toml]
